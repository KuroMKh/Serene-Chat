<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Serene Chat - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       1. CSS VARIABLES & RESET
       ========================================= */
    :root {
      --purple: #5B5CEC;
      --purple-dark: #4040d0;
      --purple-light: #7C7CF5;
      --purple-bg: #f0f0ff;
      --purple-glow: rgba(91,92,236,0.15);
      --bg: #f7f8fc;
      --surface: #ffffff;
      --border: #ebebf5;
      --text: #1a1a2e;
      --text-muted: #7a7a9a;
      --text-dim: #b0b0c8;
      --danger: #ff4d6a;
      --success: #2ed47a;
      --font: 'Nunito', sans-serif;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    /* FLUID ADJUSTMENT: Removed centering constraint, added fluid padding */
    body { 
      font-family: var(--font); 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      padding: 30px 5% 100px 5%; 
    }

    /* FLUID CONTAINER: Max-width changed to 100% to fill any screen */
    .wrap { 
      width: 100%; 
      max-width: 100%; 
      margin: 0 auto;
    }

    /* =========================================
       2. HEADER & GREETING
       ========================================= */
    .greeting { margin-bottom: 24px; }
    
    .greeting-row { 
      display: flex; 
      align-items: flex-start; 
      justify-content: space-between; 
      gap: 12px; 
    }
    
    .greeting .hello { 
      font-size: 14px; 
      color: var(--text-muted); 
      font-weight: 600; 
    }
    
    .greeting h1 { 
      font-size: 28px; 
      font-weight: 800; 
      color: var(--text); 
      margin-top: 2px; 
      line-height: 1.2; 
    }
    
    .avatar-circle { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      overflow: hidden; 
      border: 3px solid var(--purple-bg); 
      flex-shrink: 0; 
      box-shadow: 0 4px 12px var(--purple-glow); 
      transition: transform 0.2s; 
      cursor: pointer; 
    }
    
    .avatar-circle:hover { transform: scale(1.05); }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

    /* =========================================
       3. USER IDENTITY CARD
       ========================================= */
    .user-card { 
      background: linear-gradient(135deg, var(--purple), var(--purple-light)); 
      border-radius: 20px; 
      padding: 18px 20px; 
      margin-bottom: 20px; 
      display: flex; 
      align-items: center; 
      gap: 14px; 
      box-shadow: 0 6px 20px var(--purple-glow); 
      position: relative; 
      overflow: hidden; 
    }
    
    .user-card::before { 
      content: ''; position: absolute; top: -20px; right: -20px; 
      width: 100px; height: 100px; border-radius: 50%; 
      background: rgba(255,255,255,0.08); 
    }
    
    .user-card::after { 
      content: ''; position: absolute; bottom: -30px; right: 60px; 
      width: 80px; height: 80px; border-radius: 50%; 
      background: rgba(255,255,255,0.05); 
    }
    
    .uc-avatar { 
      width: 46px; height: 46px; border-radius: 50%; 
      overflow: hidden; border: 3px solid rgba(255,255,255,0.4); 
      flex-shrink: 0; 
    }
    
    .uc-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .uc-info { flex: 1; min-width: 0; z-index: 1; }
    
    .uc-name { 
      font-size: 16px; font-weight: 800; color: #fff; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    
    .uc-email { 
      font-size: 12px; color: rgba(255,255,255,0.7); 
      margin-top: 2px; font-weight: 600; 
    }
    
    .uc-badge { 
      display: inline-flex; align-items: center; gap: 4px; 
      background: rgba(255,255,255,0.2); border-radius: 20px; 
      padding: 4px 10px; font-size: 11px; font-weight: 800; 
      color: #fff; margin-top: 6px; 
    }
    
    .uc-dot { 
      width: 6px; height: 6px; border-radius: 50%; 
      background: var(--success); 
    }
    
    .logout-btn { 
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.25); 
      color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; 
      font-weight: 700; font-family: var(--font); cursor: pointer; 
      transition: 0.2s; z-index: 1; white-space: nowrap; flex-shrink: 0; 
    }
    
    .logout-btn:hover { background: rgba(255,255,255,0.25); }

    /* =========================================
       4. SEARCH & INPUTS
       ========================================= */
    .search-bar { 
      position: relative; 
      margin-bottom: 24px; 
    }
    
    .search-bar input { 
      width: 100%; padding: 14px 18px 14px 46px; 
      background: var(--surface); border: 1.5px solid var(--border); 
      border-radius: 16px; color: var(--text); font-size: 14px; 
      font-family: var(--font); font-weight: 600; outline: none; 
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
    }
    
    .search-bar input::placeholder { color: var(--text-dim); font-weight: 500; }
    .search-bar input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px var(--purple-glow); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; pointer-events: none; }

    /* =========================================
       5. ROOM LIST & ITEMS
       ========================================= */
    .section-label { 
      font-size: 11px; font-weight: 800; letter-spacing: 1.2px; 
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; 
    }

    .room-item { 
      background: var(--surface); border-radius: 18px; 
      padding: 14px 16px; margin-bottom: 10px; display: flex; 
      align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1.5px solid transparent; 
    }
    
    .room-item:hover { 
      border-color: var(--purple); box-shadow: 0 4px 16px var(--purple-glow); 
      transform: translateY(-1px); 
    }
    
    .room-avatar { 
      width: 50px; height: 50px; border-radius: 16px; 
      background: linear-gradient(135deg, var(--purple), var(--purple-light)); 
      display: flex; align-items: center; justify-content: center; 
      font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 10px var(--purple-glow); 
    }
    
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
    
    .room-actions { display: flex; align-items: center; gap: 4px; }
    
    .edit-btn, .delete-btn { 
      border: none; border-radius: 8px; padding: 6px 10px; 
      font-size: 13px; cursor: pointer; transition: 0.2s; 
      font-family: var(--font); font-weight: 700; 
    }
    .edit-btn { background: var(--purple-bg); color: var(--purple); margin-right: 4px; }
    .edit-btn:hover { background: #d8d8ff; }
    
    .delete-btn { background: #fff0f3; color: var(--danger); }
    .delete-btn:hover { background: #ffe0e6; }
    
    .go-arrow { color: var(--text-dim); font-size: 20px; font-weight: 700; transition: color 0.2s; margin-left: 2px;}
    .room-item:hover .go-arrow { color: var(--purple); }

    /* =========================================
       6. EMPTY STATES & ALERTS
       ========================================= */
    .empty-state { 
      background: var(--surface); border: 1.5px solid var(--border); 
      border-radius: 18px; padding: 32px 20px; text-align: center; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 18px; 
    }
    
    .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; color: var(--text-muted); font-weight: 600; line-height: 1.6; }

    /* =========================================
       7. FLOATING ACTION BUTTON (FAB)
       ========================================= */
    .fab { 
      position: fixed; bottom: 28px; right: 28px; 
      width: 58px; height: 58px; border-radius: 50%; 
      background: linear-gradient(135deg, var(--purple), var(--purple-light)); 
      border: none; cursor: pointer; display: flex; align-items: center; 
      justify-content: center; font-size: 26px; color: white; 
      box-shadow: 0 8px 28px rgba(91,92,236,0.45); transition: all 0.2s; z-index: 100; 
    }
    
    .fab:hover { transform: scale(1.1) rotate(10deg); }

    /* =========================================
       8. LOADING OVERLAY
       ========================================= */
    .overlay { 
      position: fixed; inset: 0; background: rgba(26,26,46,0.6); 
      backdrop-filter: blur(8px); z-index: 9999; display: flex; 
      flex-direction: column; justify-content: center; align-items: center; padding: 24px; 
    }
    
    #loadingOverlay { display: flex; }
    
    .spinner { 
      width: 38px; height: 38px; border: 3px solid var(--border); 
      border-top-color: var(--purple); border-radius: 50%; 
      animation: spin 0.8s linear infinite; margin: 0 auto 16px; 
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="overlay">
    <div class="spinner"></div>
    <p style="color:#7a7a9a; font-size:14px; font-weight:700;">Loading…</p>
  </div>

  <div class="wrap" id="mainContent" style="display:none;">

    <div class="greeting">
      <div class="greeting-row">
        <div>
          <div class="hello">Hello,</div>
          <h1 id="greetName">there 👋</h1>
        </div>
        <div class="avatar-circle">
          <img id="avatarTop" src="" alt="avatar">
        </div>
      </div>
    </div>

    <div class="user-card">
      <div class="uc-avatar">
        <img id="avatarCard" src="" alt="">
      </div>
      <div class="uc-info">
        <div class="uc-name" id="ucName">—</div>
        <div class="uc-email" id="ucEmail">—</div>
        <div class="uc-badge"><div class="uc-dot"></div> Verified Member</div>
      </div>
      <button class="logout-btn" onclick="signOut()">Sign Out</button>
    </div>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input id="roomInput" placeholder="Search or enter room code…" onkeydown="if(event.key==='Enter') joinRoom()" />
    </div>

    <div id="roomsSection" style="display:none;">
      <div class="section-label">Recent Rooms</div>
      <div id="roomList"></div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="es-icon">💬</div>
      <p>No rooms yet!<br>Use the + button to create a room, or search a code above to join one.</p>
    </div>

  </div>

  <button class="fab" onclick="createRoom()" title="New Room">＋</button>

  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  
  <script>
    /** * INIT DATABASE
     */
    const db = firebase.firestore();

    /** * AUTHENTICATION OBSERVER
     * Checks if the user is logged in, an anonymous guest, or verified.
     */
    firebase.auth().onAuthStateChanged((user) => {
      document.getElementById("loadingOverlay").style.display = "none";
      
      // Route protections
      if (!user) { 
        window.location.replace("login.html"); 
        return; 
      }
      if (user.isAnonymous) { 
        window.location.replace("au.html"); 
        return; 
      }

      // Populate UI with verified user data
      const avatarSrc = `https://api.dicebear.com/7.x/personas/svg?seed=${user.uid}`;
      const name = user.displayName || "User";

      document.getElementById("greetName").textContent = name + " 👋";
      document.getElementById("avatarTop").src = avatarSrc;
      document.getElementById("avatarCard").src = avatarSrc;
      document.getElementById("ucName").textContent = name;
      document.getElementById("ucEmail").textContent = user.email || "";
      
      // Display content and fetch data
      document.getElementById("mainContent").style.display = "block";
      loadRooms(user.uid);
    });

    /** * FETCH SAVED ROOMS
     * Listens to the Firestore database and generates UI for recent rooms.
     */
    function loadRooms(uid) {
      const list = document.getElementById("roomList");
      const roomsSection = document.getElementById("roomsSection");
      const emptyState = document.getElementById("emptyState");

      db.collection("users").doc(uid).collection("saved_rooms")
        .orderBy("lastVisited", "desc")
        .limit(15)
        .onSnapshot((snapshot) => {
          list.innerHTML = "";

          // Show empty state if no rooms exist
          if (snapshot.empty) {
            roomsSection.style.display = "none";
            emptyState.style.display = "block";
            return;
          }

          roomsSection.style.display = "block";
          emptyState.style.display = "none";

          // Generate UI for each room
          const emojis = ['🌿','🕊️','🌊','🌸','☀️','🌙','🍃','🦋','🌺','🦚'];
          
          snapshot.forEach((doc) => {
            const data = doc.data();
            const hasName = data.customName && data.customName.trim();
            const displayName = hasName ? data.customName : `Room: ${doc.id}`;
            const sub = hasName ? `ID: ${doc.id}` : "Tap to enter";
            const emoji = emojis[doc.id.charCodeAt(0) % emojis.length];

            const div = document.createElement("div");
            div.className = "room-item";
            div.innerHTML = `
              <div class="room-avatar">${emoji}</div>
              <div class="room-info">
                <div class="room-name">${displayName}</div>
                <div class="room-sub">${sub}</div>
              </div>
              <div class="room-actions">
                <button class="delete-btn" title="Delete Room" onclick="deleteRoom(event,'${doc.id}','${uid}')">🗑</button>
                <button class="edit-btn" title="Rename Room" onclick="renameRoom(event,'${doc.id}','${uid}')">✎</button>
                <span class="go-arrow">›</span>
              </div>`;
            
            div.onclick = () => window.location.href = `room.html?room=${doc.id}`;
            list.appendChild(div);
          });
        });
    }

    /** * RENAME ROOM
     */
    function renameRoom(event, roomId, uid) {
      event.stopPropagation(); // Prevents joining the room when clicking edit
      const newName = prompt("Enter a new name for this room:");
      
      if (newName && newName.trim()) {
        db.collection("users").doc(uid).collection("saved_rooms").doc(roomId)
          .update({ customName: newName.trim() })
          .catch(e => alert("Error: " + e.message));
      }
    }

    /** * DELETE ROOM
     */
    function deleteRoom(event, roomId, uid) {
      event.stopPropagation(); // Prevents joining the room when clicking delete
      
      if (confirm("Are you sure you want to remove this room from your history?")) {
        db.collection("users").doc(uid).collection("saved_rooms").doc(roomId)
          .delete()
          .catch(e => alert("Error deleting room: " + e.message));
      }
    }

    /** * CREATE NEW ROOM
     */
    function createRoom() {
      const id = Math.random().toString(36).substring(2,8) + "-" + Math.random().toString(36).substring(2,6);
      window.location.href = `room.html?room=${id}`;
    }

    /** * JOIN EXISTING ROOM
     */
    function joinRoom() {
      const room = document.getElementById("roomInput").value.trim();
      if (room) {
        window.location.href = `room.html?room=${room}`;
      } else {
        alert("Please enter a room name or code first.");
      }
    }

    /** * SIGN OUT
     */
    function signOut() {
      firebase.auth().signOut().then(() => window.location.replace("login.html"));
    }
  </script>
</body>
</html>
