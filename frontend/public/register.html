<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – Serene Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="auth-page">
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <img src="assets/icon.png" alt="Serene Chat Logo">
      </div>
      <h1>Serene Chat</h1>
      <p>A safe space to talk and connect</p>
    </div>

    <div class="card-title">Create Account</div>
    <div id="errorMsg" class="error-box"></div>
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="username" placeholder="What should we call you?" required />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label>Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Min. 6 characters" required />
        <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" onclick="togglePassword(this)">
          <i data-lucide="eye" class="eye-icon eye-open" aria-hidden="true"></i>
          <i data-lucide="eye-off" class="eye-icon eye-off" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="register()">Create Account →</button>
    <p class="link-text">Already have an account? <a id="loginLink" href="login.html">Sign in</a></p>
  </div>
</div>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectRoom = urlParams.get('room');
    if (redirectRoom) document.getElementById("loginLink").href = `login.html?room=${redirectRoom}`;
    function register() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('username').value;
      const errorDiv = document.getElementById('errorMsg');
      if (!email || !password || !displayName) {
        errorDiv.textContent = "Please fill in all fields.";
        errorDiv.style.display = "block"; return;
      }
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(c => c.user.updateProfile({ displayName }))
        .then(() => {
          window.location.href = redirectRoom ? `room.html?room=${redirectRoom}` : "vu.html";
        })
        .catch(e => { document.getElementById('errorMsg').textContent = e.message; document.getElementById('errorMsg').style.display = "block"; });
    }
  </script>
</body>
</html>
