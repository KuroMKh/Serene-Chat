<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room – Serene</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="preconnect" href="https://tfhub.dev" crossorigin>
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. CSS VARIABLES & RESET
       ========================================= */
    :root {
      --purple: #5B5CEC; --purple-dark: #4040d0; --purple-light: #7C7CF5;
      --purple-bg: #f0f0ff; --purple-glow: rgba(91,92,236,0.15);
      --bg: #f0f0ff; --surface: #ffffff; --border: #e0e0f5;
      --text: #1a1a2e; --text-muted: #7a7a9a; --text-dim: #b0b0c8;
      --danger: #ff4d6a; --success: #2ed47a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; margin: 0; overflow: hidden; }
    
    /* TRUE FLUID CONTAINER: 100% width and 100% height across ALL devices */
    .chat-wrapper { width: 100vw; height: 100dvh; display: flex; flex-direction: column; background: var(--surface); }

    /* =========================================
       2. HEADER
       ========================================= */
    .chat-header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--purple); flex-shrink: 0; z-index: 10; }
    .back-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 24px; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; line-height: 0; padding-bottom: 4px; }
    .back-btn:hover { background: rgba(255,255,255,0.3); }
    .room-avatar-wrap { position: relative; flex-shrink: 0; }
    .room-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 17px; border: 2px solid rgba(255,255,255,0.4); }
    .online-indicator { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; border-radius: 50%; background: var(--success); border: 2px solid var(--purple); }
    .header-info { flex: 1; min-width: 0; }
    .header-room-name { font-size: clamp(15px, 4vw, 18px); font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; display: flex; align-items: center; gap: 5px; font-weight: 600; flex-wrap: wrap; }
    .ai-pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2px 6px; font-size: 10px; font-weight: 700; color: #fff; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .status-ready { background: var(--success) !important; box-shadow: 0 0 5px rgba(46,212,122,0.6); }
    .status-loading { background: #ffd60a !important; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .copy-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 11px; font-weight: 700; font-family: 'Nunito', sans-serif; padding: 6px 9px; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
    .copy-btn:hover { background: rgba(255,255,255,0.3); }

    /* =========================================
       3. CHAT AREA
       ========================================= */
    #chatBox { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); scroll-behavior: smooth; }
    #chatBox::-webkit-scrollbar { width: 6px; }
    #chatBox::-webkit-scrollbar-track { background: transparent; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* =========================================
       4. MESSAGES
       ========================================= */
    .message { display: flex; flex-direction: column; width: fit-content; max-width: 85%; animation: msgIn 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    @media (min-width: 768px) { .message { max-width: 65%; } } /* Keep text readable on huge screens */
    @keyframes msgIn { from{opacity:0;transform:translateY(12px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
    .own { align-self: flex-end; } .other { align-self: flex-start; }
    .message:not(.grouped) { margin-top: 14px; } .message.grouped { margin-top: 3px; } .message.grouped .sender { display: none; }
    .sender { font-weight: 800; font-size: 11px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; color: var(--purple); padding: 0 6px; }
    .own .sender { flex-direction: row-reverse; color: var(--text-muted); }
    .avatar { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,0.1); object-fit: cover; }
    .verified-badge { color: var(--purple); font-size: 11px; }
    .msg-content { padding: 12px 16px; font-size: 15px; font-weight: 600; line-height: 1.5; word-wrap: break-word; width: fit-content; transition: background 0.3s, border-color 0.3s, color 0.3s; }
    .other .msg-content { background: var(--bg); color: var(--text); border-radius: 4px 18px 18px 18px; border: 1px solid var(--border); }
    .own .msg-content { background: var(--purple); color: #fff; border-radius: 18px 4px 18px 18px; box-shadow: 0 4px 14px var(--purple-glow); }
    .msg-time { font-size: 10px; color: var(--text-dim); margin-top: 4px; padding: 0 6px; font-weight: 600; }
    .own .msg-time { text-align: right; }

    /* --- Severity-tiered risk styling (High / Medium / Low) --- */
    .message.risk-high .msg-content { border: 2px solid var(--danger) !important; background: #fff0f3 !important; color: #c0002a !important; }
    .own.risk-high .msg-content { background: #ff6b81 !important; border: 2px solid var(--danger) !important; color: white !important; }

    .message.risk-medium .msg-content { border: 2px solid #ff9f1c !important; background: #fff8ee !important; color: #b45f00 !important; }
    .own.risk-medium .msg-content { background: #ffb347 !important; border: 2px solid #ff9f1c !important; color: white !important; }

    .message.risk-low .msg-content { border: 2px solid #ffd60a !important; background: #fffbea !important; color: #8a6d00 !important; }
    .own.risk-low .msg-content { background: #ffe066 !important; border: 2px solid #ffd60a !important; color: #4a3900 !important; }

    .chat-image { max-width: 100%; max-height: 250px; border-radius: 12px; cursor: pointer; object-fit: contain; }
    .invite-box { background: var(--purple-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 13px; font-weight: 600; width: 100%; color: var(--text); }
    .invite-box strong { color: var(--purple); }
    .btn-join-private { margin-top: 10px; padding: 8px 14px; background: var(--purple); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: 'Nunito', sans-serif; transition: 0.2s; display: block; width: 100%; text-align: center; }
    .btn-join-private:hover { background: var(--purple-dark); }
    .clickable-sender { cursor: pointer; text-decoration: underline dotted; color: var(--purple); transition: 0.2s; }
    .clickable-sender:hover { text-decoration-style: solid; }

    /* =========================================
       5. FOOTER & INPUTS
       ========================================= */
    .chat-footer { padding: 14px 20px; background: var(--surface); border-top: 1.5px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .footer-icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--purple-bg); border: 1px solid var(--border); border-radius: 50%; cursor: pointer; font-size: 18px; transition: 0.2s; flex-shrink: 0; color: var(--purple); }
    .footer-icon-btn:hover { background: #e0e0ff; border-color: var(--purple); }
    #msgInput { flex: 1; padding: 14px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; color: var(--text); font-size: 15px; font-family: 'Nunito', sans-serif; font-weight: 600; outline: none; transition: 0.2s; min-width: 0; }
    #msgInput:focus { border-color: var(--purple); box-shadow: 0 0 0 4px var(--purple-glow); background: var(--surface); }
    .send-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--purple), var(--purple-light)); border: none; border-radius: 50%; cursor: pointer; font-size: 18px; color: white; box-shadow: 0 4px 14px var(--purple-glow); transition: 0.2s; flex-shrink: 0; }
    .send-btn:hover { transform: scale(1.05); } .send-btn:active { transform: scale(0.95); }

    /* =========================================
       6. OVERLAYS & MODALS
       ========================================= */
    .overlay { position: fixed; inset: 0; background: rgba(26,26,46,0.65); backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
    #loginOverlay { display: none; } #loadingOverlay { display: flex; }
    .overlay-card { background: var(--surface); border-radius: 24px; padding: 32px; max-width: 320px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .overlay-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .btn-large { padding: 14px; font-size: 15px; font-weight: 700; background: var(--purple); color: white; border: none; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #previewOverlay { display: none; } #previewImage { max-width: 100%; max-height: 40vh; border-radius: 12px; margin-bottom: 20px; }
    .preview-actions { display: flex; gap: 10px; width: 100%; }
    .preview-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-cancel { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); } .btn-confirm { background: var(--purple); color: white; }

    /* =========================================
       7. RISK ALERTS
       ========================================= */
    #riskAlertOverlay { position: fixed; top: 16px; left: 0; right: 0; margin: 0 auto; z-index: 11000; width: calc(100% - 32px); max-width: 400px; display: none; flex-direction: column; gap: 10px; pointer-events: none; }
    .alert-card { background: var(--surface); border-left: 4px solid var(--danger); box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 14px; border-radius: 14px; animation: slideIn 0.3s ease; pointer-events: auto; }
    .alert-header { font-weight: 800; color: var(--danger); display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .alert-body { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; background: var(--bg); padding: 10px; border-radius: 8px; }
    .alert-actions { display: flex; gap: 8px; }
    .alert-actions button { flex: 1; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s; }
    .btn-dismiss { background: var(--bg); color: var(--text-muted); }
    @keyframes slideIn { from{transform:translateY(-20px);opacity:0} to{transform:translateY(0);opacity:1} }
    #enableNotifyBtn { display: none; position: fixed; bottom: 90px; right: 20px; background: var(--purple); color: white; padding: 12px 20px; border-radius: 30px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-weight: 700; font-size: 13px; z-index: 100; transition: 0.2s; }
    #enableNotifyBtn:hover { transform: translateY(-2px); }

    /* =========================================
       8. RISK LOG MODAL
       ========================================= */
    .risk-log-card { max-width: 500px !important; width: 90%; max-height: 80vh; display: flex; flex-direction: column; padding: 24px; }
    #riskLogContent { flex: 1; overflow-y: auto; text-align: left; display: flex; flex-direction: column; gap: 12px; padding-right: 8px; }
    #riskLogContent::-webkit-scrollbar { width: 6px; }
    #riskLogContent::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .log-item { background: var(--bg); border-left: 4px solid var(--danger); padding: 12px; border-radius: 8px; font-size: 13px; }
    .log-meta { font-weight: 800; color: var(--danger); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<button id="enableNotifyBtn" onclick="requestNotifyPermission()">🔔 Enable Alerts</button>
<div id="riskAlertOverlay"></div>

<div id="loadingOverlay" class="overlay">
  <div class="spinner"></div>
  <p style="color:#7a7a9a;font-size:14px;font-weight:700;">Connecting to room…</p>
</div>

<div id="loginOverlay" class="overlay">
  <div class="overlay-card">
    <div style="font-size:40px;margin-bottom:12px;">🔒</div>
    <h2>Sign In Required</h2>
    <p>You need to sign in to join this chat room.</p>
    <button class="btn-large" onclick="redirectToLogin()">Go to Login</button>
  </div>
</div>

<div id="previewOverlay" class="overlay">
  <div class="overlay-card" style="padding: 24px;">
    <h3 style="margin-bottom: 16px; font-weight:800; font-size:18px;">Send this image?</h3>
    <img id="previewImage" src="" alt="Preview">
    <div class="preview-actions">
      <button class="preview-btn btn-cancel"  onclick="cancelUpload()">Cancel</button>
      <button class="preview-btn btn-confirm" onclick="confirmUpload()">Send ↑</button>
    </div>
    <div id="uploadStatus" style="margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
  </div>
</div>

<div id="riskLogOverlay" class="overlay" style="display: none;">
  <div class="overlay-card risk-log-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="margin: 0; color: var(--danger); font-size: 18px;">⚠️ Flagged History</h2>
      <button onclick="document.getElementById('riskLogOverlay').style.display='none'" style="background:none; border:none; font-size:20px; cursor:pointer; color: var(--text-muted);">✕</button>
    </div>
    <div id="riskLogContent"></div>
  </div>
</div>

<div class="chat-wrapper">
  <header class="chat-header">
    <button class="back-btn" id="backBtn">‹</button>
    <div class="room-avatar-wrap">
      <div class="room-avatar">💬</div>
      <div class="online-indicator"></div>
    </div>
    <div class="header-info">
      <div class="header-room-name" id="roomId">Loading…</div>
      <div class="header-sub">
        <span id="userList">0 online</span>
        <div class="ai-pill">
          <div class="status-dot status-loading" id="aiDot"></div>
          <span id="aiText">AI loading</span>
        </div>
      </div>
    </div>
    <button id="riskLogBtn" class="copy-btn" style="display:none; background: var(--danger); margin-right: 8px;" onclick="openRiskLog()">⚠️ Log</button>
    <button class="copy-btn" onclick="copyRoomLink()">⛓ Copy Link</button>
  </header>

  <div id="chatBox"></div>

  <footer class="chat-footer">
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleFileSelect(this)" />
    <button class="footer-icon-btn" onclick="document.getElementById('imageInput').click()" title="Send image">📷</button>
    <input id="msgInput" placeholder="Type a message…" />
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="e2e-crypto.js"></script>
<script src="ai-detector.js"></script>

<audio id="notifySound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>
<audio id="alertSound"  src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script>
  if (typeof firebase === 'undefined') alert("Firebase not loaded!");
  const db = firebase.firestore();
  let storage; try { storage = firebase.storage(); } catch (e) { console.error("Storage not available"); }

  const roomId = new URLSearchParams(window.location.search).get('room');
  if (roomId) document.getElementById("roomId").textContent = roomId; else alert("No Room ID found!");

  let currentUser = null, username = "", isRegistered = false, fileToUpload = null;

  firebase.auth().onAuthStateChanged((user) => {
    document.getElementById("loadingOverlay").style.display = "none";
    document.getElementById("backBtn").onclick = () => { window.location.href = (!user || user.isAnonymous) ? "au.html" : "vu.html"; };
    if (!user) {
      document.getElementById("loginOverlay").style.display = "flex";
    } else {
      currentUser = user;
      if (user.isAnonymous) { username = generateRandomName(); isRegistered = false; } 
      else {
        username = user.displayName; isRegistered = true;
        saveRoomToHistory(user.uid);
        document.getElementById("riskLogBtn").style.display = "block";
        if ("Notification" in window && Notification.permission === "default") document.getElementById("enableNotifyBtn").style.display = "block";
      }
      initChat(); loadAI(); 
    }
  });

  // Message is written immediately so it appears instantly; risk analysis runs
  // in the background and patches the result in a moment later. Until then the
  // message carries riskLevel "pending", which renders uncoloured and unalerted.
  async function sendMessage() {
    const text = document.getElementById("msgInput").value.trim();
    if (!text) return;
    document.getElementById("msgInput").value = "";

    const encryptedText = await encrypt(text);
    const docRef = await db.collection("rooms").doc(roomId).collection("messages").add({
      user: username, text: encryptedText, type: 'text', verified: isRegistered,
      isRisk: false, riskLevel: "pending", riskScore: null,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });

    analyzeRisk(text).then((analysis) => {
      docRef.update({
        isRisk: analysis.isRisk,
        riskLevel: analysis.riskLevel,
        riskScore: analysis.finalScore
      });
    }).catch((e) => console.warn("Risk analysis failed:", e));
  }

  function handleFileSelect(input) {
    const file = input.files[0]; if (!file) return; fileToUpload = file; const reader = new FileReader();
    reader.onload = (e) => { document.getElementById("previewImage").src = e.target.result; document.getElementById("previewOverlay").style.display = "flex"; };
    reader.readAsDataURL(file); input.value = "";
  }
  function cancelUpload() { fileToUpload = null; document.getElementById("previewOverlay").style.display = "none"; document.getElementById("uploadStatus").textContent = ""; }
  function confirmUpload() {
    if (!fileToUpload || !storage) return;
    const status = document.getElementById("uploadStatus"); status.textContent = "Uploading… 0%";
    const ref = storage.ref(`chat_images/${roomId}/${Date.now()}_${fileToUpload.name}`);
    const task = ref.put(fileToUpload);
    task.on('state_changed',
      (snapshot) => { const percent = Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100); status.textContent = `Uploading… ${percent}%`; },
      (error) => { alert("Upload failed: " + error.message); cancelUpload(); },
      () => { task.snapshot.ref.getDownloadURL().then((url) => { sendImageMessage(url); cancelUpload(); }); }
    );
  }
  function sendImageMessage(url) { db.collection("rooms").doc(roomId).collection("messages").add({ user: username, imageUrl: url, text: "📷 Image", type: 'image', verified: isRegistered, time: firebase.firestore.FieldValue.serverTimestamp() }); }

  function requestPrivateSession(target) {
    if (confirm(`Start a private session with ${target}?`)) {
      const pvRoom = "private-" + Math.random().toString(36).substring(2,12);
      db.collection("rooms").doc(roomId).collection("messages").add({
        user: username, targetUser: target, privateRoomId: pvRoom, type: 'invite', verified: isRegistered, isRisk: false, time: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => { setTimeout(() => { window.location.href = `room.html?room=${pvRoom}`; }, 500); }).catch((error) => alert("Error: " + error.message));
    }
  }

  function requestNotifyPermission() { Notification.requestPermission().then((p) => { if (p === "granted") { document.getElementById("enableNotifyBtn").style.display = "none"; alert("Notifications enabled!"); } }); }

  /* UPDATED showRiskAlert: Dismiss only */
  function showRiskAlert(data) {
    document.getElementById("alertSound").play().catch(()=>{});
    if (Notification.permission === "granted") { new Notification("⚠️ RISK ALERT", { body: `${data.user}: ${data.text}` }); }
    const overlay = document.getElementById("riskAlertOverlay"); overlay.style.display = "flex";
    const card = document.createElement("div"); card.className = "alert-card";
    card.innerHTML = `
      <div class="alert-header"><span>⚠️ Potential Risk Detected</span><span style="cursor:pointer" onclick="this.parentElement.parentElement.remove()">✕</span></div>
      <div class="alert-body"><strong>User:</strong> ${data.user}<br><strong>Message:</strong> "${data.text}"</div>
      <div class="alert-actions">
        <button class="btn-dismiss" style="width: 100%;" onclick="this.parentElement.parentElement.remove()">Dismiss</button>
      </div>`;
    setTimeout(() => card.remove(), 20000); overlay.appendChild(card);
  }

  function redirectToLogin() { window.location.href = `login.html?room=${roomId}`; }
  function generateRandomName() { let name = sessionStorage.getItem('anon_nick'); if (!name) { name = "Guest-" + Math.floor(Math.random() * 1000); sessionStorage.setItem('anon_nick', name); } return name; }
  function saveRoomToHistory(uid) { db.collection("users").doc(uid).collection("saved_rooms").doc(roomId).set({ lastVisited: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); }
  function copyRoomLink() { navigator.clipboard.writeText(window.location.href).then(() => { const btn = document.querySelector('.copy-btn'); btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = '⛓ Copy Link', 2000); }); }

  async function initChat() {
    await initRoomKey(roomId);
    const docId = isRegistered ? currentUser.uid : username;
    const userRef = db.collection("rooms").doc(roomId).collection("users").doc(docId);
    const ping = () => { userRef.set({ lastSeen: firebase.firestore.FieldValue.serverTimestamp(), name: username }, { merge: true }).catch(()=>{}); };
    ping(); let heartbeat = setInterval(ping, 10000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) clearInterval(heartbeat); else { ping(); heartbeat = setInterval(ping, 10000); } });
    window.addEventListener("beforeunload", () => userRef.delete());

    let firstLoad = true; let lastSender = null;
    const alertedMsgIds = new Set(); // 🔥 FIX: Track which alerts have been shown

    db.collection("rooms").doc(roomId).collection("messages").orderBy("time", "desc").limit(50).onSnapshot(async (snap) => {
        const box = document.getElementById("chatBox"); box.innerHTML = ""; lastSender = null;
        
        const messages = []; 
        snap.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id; // 🔥 FIX: Grab document ID
          messages.push(data);
        });
        messages.reverse();
        
        for (const d of messages) {
          let plainText = d.text || "";
          if (d.type === 'text' && d.text) { plainText = await decrypt(d.text); }
          const isOwn = d.user === username; const badge = d.verified ? `<span class="verified-badge">✓</span>` : '';

          // Severity tier. "pending" = analysis still running, treat as unflagged.
          // Legacy messages (flagged before tiering existed) default to "medium".
          let level = d.isRisk ? (d.riskLevel || "medium") : null;
          if (level === "pending") level = null;

          // Only auto-popup an alert for medium/high — "low" stays quiet in the log
          // so therapists aren't alert-fatigued by borderline messages.
          if (!firstLoad && d.isRisk && isRegistered && !isOwn && level && level !== "low") {
            if (!alertedMsgIds.has(d.id)) {
              const t = d.time ? d.time.toDate() : new Date(); 
              if (new Date() - t < 10000) { 
                showRiskAlert({ user: d.user, text: plainText }); 
                alertedMsgIds.add(d.id); // Add to memory
              } 
            }
          }
          
          let content = "";
          if (d.type === 'image' || d.imageUrl) { content = `<img src="${d.imageUrl}" class="chat-image" onclick="window.open(this.src,'_blank')" />`; } 
          else if (d.type === 'invite') { const isTarget = d.targetUser === username; content = `<div class="invite-box"><strong>🔒 Private Session Request</strong><br><span style="font-size:12px;color:var(--text-muted);display:block;margin-top:4px;">From: ${d.user} → To: ${d.targetUser}</span>${isTarget || isOwn ? `<button class="btn-join-private" onclick="window.location.href='room.html?room=${d.privateRoomId}'">Join Private Room →</button>` : `<span style="font-size:12px;color:var(--text-dim);display:block;margin-top:8px;">Only ${d.targetUser} can join.</span>`}</div>`; } 
          else { content = plainText; }
          const riskCls = (isRegistered && level) ? `risk-flagged risk-${level}` : "";
          const groupedCls = (lastSender === d.user) ? "grouped" : ""; lastSender = d.user;
          let senderHtml = (!isRegistered && d.verified && !isOwn) ? `<span class="clickable-sender" onclick="requestPrivateSession('${d.user}')" title="Request private session">${d.user}</span> ${badge}` : `<span>${isOwn ? 'You' : d.user}</span> ${badge}`;
          const timeStr = d.time ? d.time.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : "";
          const el = document.createElement("div"); el.className = `message ${isOwn ? 'own' : 'other'} ${riskCls} ${groupedCls}`;
          el.innerHTML = `<div class="sender"><img class="avatar" src="https://api.dicebear.com/7.x/personas/svg?seed=${d.user}" alt="User" />${senderHtml}</div><div class="msg-content">${content}</div><div class="msg-time">${timeStr}</div>`;
          box.appendChild(el);
        }
        if (!firstLoad) { document.getElementById("notifySound").play().catch(()=>{}); }
        box.scrollTop = box.scrollHeight; firstLoad = false;
    });
    db.collection("rooms").doc(roomId).collection("users").onSnapshot((snap) => {
      const now = new Date(); let online = 0;
      snap.forEach((d) => { if (d.data().lastSeen && (now - d.data().lastSeen.toDate() < 20000)) { online++; } });
      document.getElementById("userList").textContent = `${online} online`;
    });
  }

  function openRiskLog() {
    document.getElementById("riskLogOverlay").style.display = "flex";
    const content = document.getElementById("riskLogContent");
    content.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding: 20px;'>Fetching secure logs…</p>";

    const LEVEL_COLORS = { high: '#c0002a', medium: '#b45f00', low: '#8a6d00' };
    
    db.collection("rooms").doc(roomId).collection("messages").where("isRisk", "==", true).orderBy("time", "desc").limit(30).get().then((snapshot) => {
        content.innerHTML = ""; 
        if (snapshot.empty) { content.innerHTML = "<p style='text-align:center; color:var(--success); padding: 20px;'>No flagged messages in this room.</p>"; return; }
        
        snapshot.forEach(async (doc) => {
          const d = doc.data();
          const timeStr = d.time ? d.time.toDate().toLocaleString([], {dateStyle: 'short', timeStyle: 'short'}) : "Unknown Time";
          const plainText = d.text ? await decrypt(d.text) : "(no text)";

          // Use the score/tier stored at send-time. Only recompute for legacy
          // messages that were flagged before severity tiering existed.
          let level = d.riskLevel;
          let scoreText = "";
          if (level && level !== "pending" && d.riskScore != null) {
            scoreText = `${(d.riskScore * 100).toFixed(1)}%`;
          } else {
            try {
              const analysis = await analyzeRisk(plainText);
              level = analysis.riskLevel === "none" ? "medium" : analysis.riskLevel;
              scoreText = `${(analysis.finalScore * 100).toFixed(1)}%`;
            } catch (e) {
              console.log("Calc error:", e);
              level = "medium"; scoreText = "N/A";
            }
          }
          const levelColor = LEVEL_COLORS[level] || '#c0002a';

          const el = document.createElement("div"); el.className = "log-item";
          el.innerHTML = `
            <div class="log-meta">
              <span>👤 ${d.user} <span style="color:${levelColor}; font-size:11px; margin-left:6px; font-weight:800; background:#fff0f3; padding:2px 6px; border-radius:10px;">${level.toUpperCase()} · ${scoreText}</span></span>
              <span style="font-size:10px; color:var(--text-muted);">${timeStr}</span>
            </div>
            <div style="font-weight: 600; color: var(--text);">"${plainText}"</div>`;
          content.appendChild(el);
        });
      }).catch((error) => {
        console.error("Error fetching logs:", error);
        content.innerHTML = `<p style='color:var(--danger); font-size: 13px; line-height: 1.5; padding: 10px;'><b>Database Error:</b><br>Please press F12 and click the Firebase link in the console to generate the Composite Index.</p>`;
      });
  }

  document.body.addEventListener('click', () => { if (document.activeElement.tagName !== "BUTTON" && document.activeElement.tagName !== "INPUT") { document.getElementById("msgInput").focus(); } });
  document.getElementById("msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
