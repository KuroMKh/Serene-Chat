<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Serene Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="assets/icon.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #5B5CEC;
      --purple-dark: #4040d0;
      --purple-light: #7C7CF5;
      --purple-bg: #f0f0ff;
      --purple-glow: rgba(91,92,236,0.15);
      --bg: #f7f8fc;
      --surface: #ffffff;
      --border: #ebebf5;
      --text: #1a1a2e;
      --text-muted: #7a7a9a;
      --text-dim: #b0b0c8;
      --danger: #ff4d6a;
      --font: 'Nunito', sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }

    .wrap { width: 100%; max-width: 400px; }

    .brand { text-align: center; margin-bottom: 16px; }
    
    .brand-icon { 
      width: 250px; 
      height: 250px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      margin: 0 auto 4px auto; 
    }
    
    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand h1 { font-size: 24px; font-weight: 800; color: var(--text); }
    .brand p { font-size: 14px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    .card { background: var(--surface); border-radius: 24px; padding: 32px 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); border: 1.5px solid var(--border); }
    .card-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; color: var(--text); }

    .error-box { background: #fff0f3; border: 1.5px solid #ffccd5; border-radius: 12px; padding: 12px 14px; color: var(--danger); font-size: 13px; margin-bottom: 18px; display: none; font-weight: 600; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 7px; letter-spacing: 0.8px; text-transform: uppercase; }
    input { width: 100%; padding: 14px 18px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 14px; color: var(--text); font-size: 14px; font-family: var(--font); font-weight: 600; outline: none; transition: all 0.2s; }
    input::placeholder { color: var(--text-dim); font-weight: 500; }
    input:focus { border-color: var(--purple); box-shadow: 0 0 0 4px var(--purple-glow); background: var(--surface); }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff; box-shadow: 0 6px 20px var(--purple-glow); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(91,92,236,0.3); }
    .btn-ghost { background: var(--purple-bg); color: var(--purple); border: 1.5px solid var(--border); margin-top: 10px; }
    .btn-ghost:hover { background: #e0e0ff; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0 8px; color: var(--text-dim); font-size: 12px; font-weight: 700; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .link-text { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 20px; font-weight: 600; }
    .link-text a { color: var(--purple); text-decoration: none; font-weight: 800; }
    .link-text a:hover { text-decoration: underline; }

    #loginForm { display: block; }
    #loggedInState { display: none; text-align: center; }
    .check-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">
      <img src="assets/icon.png" alt="Serene Chat Logo">
    </div>
    <h1>Serene Chat</h1>
    <p>A safe space to talk and connect</p>
  </div>

  <div class="card">
    <div id="errorMsg" class="error-box"></div>

    <div id="loginForm">
      <div class="card-title">Sign In</div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="login()">Sign In →</button>
      <div class="divider">or</div>
      <button class="btn btn-ghost" onclick="guestLogin()">👤 Continue as Guest</button>
      <p class="link-text">No account? <a id="regLink" href="register.html">Create one</a></p>
    </div>

    <div id="loggedInState">
      <span class="check-icon">✅</span>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;color:var(--text);">You're signed in!</div>
      <p style="color:var(--text-muted);font-size:14px;font-weight:500;margin-bottom:24px;">Ready to continue your conversations.</p>
      <button class="btn btn-primary" onclick="handleSuccess()">Continue to App →</button>
      <button class="btn btn-ghost" onclick="logout()" style="margin-top:10px;">Sign Out</button>
    </div>
  </div>
</div>

  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const errorDiv = document.getElementById('errorMsg');
    const urlParams = new URLSearchParams(window.location.search);
    const redirectRoom = urlParams.get('room');

    if (redirectRoom) document.getElementById("regLink").href = `register.html?room=${redirectRoom}`;

    function handleSuccess() {
      if (redirectRoom) { window.location.href = `room.html?room=${redirectRoom}`; return; }
      const user = firebase.auth().currentUser;
      window.location.replace(user && user.isAnonymous ? "au.html" : "vu.html");
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(handleSuccess)
        .catch(() => { errorDiv.textContent = "Invalid email or password. Please try again."; errorDiv.style.display = "block"; });
    }

    function guestLogin() {
      firebase.auth().signInAnonymously()
        .then(handleSuccess)
        .catch(e => { errorDiv.textContent = e.message; errorDiv.style.display = "block"; });
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        document.getElementById("loggedInState").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
      });
    }

    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("loggedInState").style.display = "block";
      }
    });
  </script>
</body>
</html>
